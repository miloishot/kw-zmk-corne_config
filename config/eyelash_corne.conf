#
# Minimal baseline config. The shield's own eyelash_corne_left.conf /
# eyelash_corne_right.conf already enable ext power, the EC11 encoder,
# Studio, split and the RPC modules -- don't duplicate them here.

CONFIG_ZMK_SLEEP=y

# nice!view
# The nice_view shield ships its own nice_view.conf which already sets
# CONFIG_ZMK_DISPLAY=y and CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n, so declaring
# ZMK_DISPLAY here is redundant -- and it is the one line that differs from a
# known-good config for this same board that does not blank.
#
# Assert BLANK_ON_IDLE explicitly: without it the screen goes dark after
# CONFIG_ZMK_IDLE_TIMEOUT (30s default) and only wakes on a keypress.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
