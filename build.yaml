---
# eyelash_corne is a SHIELD on nice_nano_v2, not a board.
# Upstream restructured it; building it as a board fails with "Invalid BOARD".
include:
  - board: nice_nano_v2
    shield: eyelash_corne_right nice_view
    #snippet: zmk-usb-logging
  - board: nice_nano_v2
    shield: eyelash_corne_left nice_view
    #snippet: zmk-usb-logging    # Uncomment to log over USB.
  - board: nice_nano_v2
    shield: eyelash_corne_left nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_studio_left
  - board: nice_nano_v2
    shield: settings_reset
