---
# eyelash_corne is a SHIELD on nice_nano_v2, not a board.
include:
  - board: nice_nano_v2
    shield: eyelash_corne_left nice_view
  - board: nice_nano_v2
    shield: eyelash_corne_right nice_view
  # Studio build for the LEFT (central) half. Flash this instead of the plain
  # left build to edit the keymap live over USB at https://zmk.studio -- no
  # rebuild, no reflash, no double-tap reset.
  #
  # CONFIG_ZMK_STUDIO=y already comes from the shield's own
  # eyelash_corne_left.conf upstream; the snippet is what adds the USB CDC-ACM
  # transport that Studio actually connects over. Without it there is nothing
  # listening, which is why dropping this entry in c272bfb silently removed
  # live editing.
  #
  # LOCKING=n means Studio can rewrite the keymap without an unlock keypress.
  # Enabling locking requires a bound &studio_unlock key, and the single-layer
  # baseline keymap has no free position for one.
  - board: nice_nano_v2
    shield: eyelash_corne_left nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: eyelash_corne_studio_left
  - board: nice_nano_v2
    shield: settings_reset
